<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-gray-200 min-h-screen flex items-center justify-center">

<div class="bg-neutral-900 border border-neutral-800 rounded-xl p-8 w-full max-w-xl">

  <h1 class="text-2xl text-white mb-4">
    Step 1 — What is your problem?
  </h1>

  <form method="post">
    <textarea
      name="problem"
      rows="6"
      required
      class="w-full bg-black border border-neutral-700 rounded-lg p-4 resize-none"
      placeholder="Describe the problem clearly..."
    ></textarea>

    <div class="mt-6 flex items-center justify-between">
      <button class="px-6 py-2 bg-blue-600 rounded-lg hover:bg-blue-500">
        Continue →
      </button>

      
      <a
        href="/history"
        class="text-sm text-gray-400 hover:text-white"
      >
        View History →
      </a>
    </div>
  </form>

</div>

</body>
</html>
